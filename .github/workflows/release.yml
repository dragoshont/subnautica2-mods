name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for manual runs only (example: v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build signed release artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate
        run: bash ./scripts/validate.sh

      - name: Package
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: ./scripts/package.ps1 -OutDir dist

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*.zip'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
