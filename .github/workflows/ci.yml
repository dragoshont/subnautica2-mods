name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate and package dry run
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate
        run: bash ./scripts/validate.sh

      - name: Package dry run
        shell: pwsh
        run: ./scripts/package.ps1 -OutDir dist

      - name: Upload CI package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  codeql:
    name: CodeQL
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

